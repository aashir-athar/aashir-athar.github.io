<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1120"/>
      <stop offset="1" stop-color="#060910"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.78" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- logo mark -->
  <g transform="translate(80, 90)">
    <rect width="56" height="56" rx="14" fill="url(#accent)"/>
    <text x="28" y="40" text-anchor="middle" font-family="Syne, system-ui, sans-serif" font-weight="800" font-size="32" fill="#ffffff">A</text>
  </g>

  <!-- status pill -->
  <g transform="translate(160, 102)">
    <rect width="290" height="36" rx="18" fill="rgba(16,185,129,0.10)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#10b981"/>
    <text x="36" y="23" font-family="DM Mono, ui-monospace, monospace" font-size="13" fill="#10b981">Available · Senior &amp; Lead Roles</text>
  </g>

  <!-- name -->
  <text x="80" y="280" font-family="Syne, system-ui, sans-serif" font-weight="800" font-size="104" fill="#f0f4ff" letter-spacing="-2">Aashir <tspan fill="url(#accent)">Athar</tspan></text>

  <!-- title -->
  <text x="80" y="350" font-family="Syne, system-ui, sans-serif" font-weight="700" font-size="42" fill="#8899bb">Senior React Native Engineer</text>

  <!-- proof line -->
  <text x="80" y="408" font-family="DM Sans, system-ui, sans-serif" font-weight="400" font-size="24" fill="#8899bb">Production mobile apps shipped to <tspan fill="#06b6d4" font-weight="600">50,000+ users</tspan>  ·  3+ years  ·  iOS &amp; Android</text>

  <!-- stat row -->
  <g transform="translate(80, 470)">
    <g>
      <text font-family="Syne, system-ui, sans-serif" font-weight="800" font-size="44" fill="#06b6d4">50K+</text>
      <text y="32" font-family="DM Mono, ui-monospace, monospace" font-size="12" fill="#4a5f80" letter-spacing="2">USERS SERVED</text>
    </g>
    <g transform="translate(220, 0)">
      <text font-family="Syne, system-ui, sans-serif" font-weight="800" font-size="44" fill="#8b5cf6">35%</text>
      <text y="32" font-family="DM Mono, ui-monospace, monospace" font-size="12" fill="#4a5f80" letter-spacing="2">FASTER LOAD TIMES</text>
    </g>
    <g transform="translate(440, 0)">
      <text font-family="Syne, system-ui, sans-serif" font-weight="800" font-size="44" fill="#10b981">0</text>
      <text y="32" font-family="DM Mono, ui-monospace, monospace" font-size="12" fill="#4a5f80" letter-spacing="2">POST-LAUNCH CRASHES</text>
    </g>
    <g transform="translate(580, 0)">
      <text font-family="Syne, system-ui, sans-serif" font-weight="800" font-size="44" fill="#f59e0b">90%</text>
      <text y="32" font-family="DM Mono, ui-monospace, monospace" font-size="12" fill="#4a5f80" letter-spacing="2">FEWER DEPLOY ERRORS</text>
    </g>
  </g>

  <!-- url footer -->
  <text x="80" y="595" font-family="DM Mono, ui-monospace, monospace" font-size="14" fill="#4a5f80">aashir-athar.github.io</text>
  <text x="1120" y="595" text-anchor="end" font-family="DM Mono, ui-monospace, monospace" font-size="14" fill="#4a5f80">Lahore · Remote worldwide</text>
</svg>
